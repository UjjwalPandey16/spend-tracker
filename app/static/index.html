<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spend Tracker</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;color:#18332e;background:#f6f8f7}section{background:white;padding:24px;border:1px solid #dce5e1;border-radius:12px;margin:20px 0}form{display:grid;gap:12px}label{display:grid;gap:5px}input,button{font:inherit;padding:10px;border:1px solid #a8bbb1;border-radius:5px}button{background:#17664d;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#status{min-height:24px}h1{margin-bottom:5px}.muted{color:#576760}</style></head>
<body><h1>Spend Tracker</h1><p class="muted">A simple personal expense log. Use one currency consistently.</p>
<p id="status" role="status" aria-live="polite"></p>
<section><h2>Add an expense</h2><form id="expense-form">
<label>Amount<input name="amount" type="number" min="0.01" max="999999999.99" step="0.01" required></label>
<label>Category<input name="category" maxlength="80" placeholder="e.g. groceries" required></label>
<label>Note<input name="note" maxlength="500"></label>
<label>Date<input name="date" type="date" required></label><button id="save">Save expense</button></form></section>
<section><h2>Monthly summary</h2><label>Month<input id="month" type="month" required></label><p id="total"></p><p id="change" class="muted"></p><ul id="categories"></ul><ul id="insights"></ul></section>
<section><h2>Recent expenses</h2><p class="muted">Latest 100 entries across all months.</p><table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th></tr></thead><tbody id="expenses"></tbody></table></section>
<script src="/static/app.js" defer></script></body></html>
